name: Publish Collected Parts

# Copies the collected Germany parts of a run onto the germany-data branch.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID of the Daily Job Search run"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download collected parts
        uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Push to germany-data branch
        run: |
          ls -la parts
          cd parts
          git init -q -b germany-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Collected Germany parts from run ${{ inputs.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" germany-data
