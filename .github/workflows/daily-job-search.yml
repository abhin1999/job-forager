name: Daily Job Search

# Germany-wide full collection. Runs the existing jobforager collectors for
# every discovered company board (no title/keyword/language filter), then
# merges, dedupes, validates URLs and exports CSV / XLSX / JSON.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Boards per source (0 = all boards). Use e.g. 50 for a smoke test."
        default: "0"
      validate_urls:
        description: "Check every application URL (true/false)"
        default: "true"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - { source: greenhouse, shard: "" }
          - { source: lever, shard: "" }
          - { source: ashby, shard: "" }
          - { source: smartrecruiters, shard: "" }
          - { source: personio, shard: "" }
          - { source: pinpoint, shard: "" }
          - { source: hiringcafe, shard: "" }
          - { source: supplementary, shard: "" }   # remotive, remoteok, arbeitnow, hackernews, weworkremotely
          - { source: workday, shard: "0/6" }
          - { source: workday, shard: "1/6" }
          - { source: workday, shard: "2/6" }
          - { source: workday, shard: "3/6" }
          - { source: workday, shard: "4/6" }
          - { source: workday, shard: "5/6" }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install curl_cffi

      - name: Collect ${{ matrix.source }} ${{ matrix.shard }}
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/germany_collect.py collect \
            --source "${{ matrix.source }}" \
            --shard "${{ matrix.shard }}" \
            --limit "${{ inputs.limit }}" \
            --workers 24 \
            --budget-min 320 \
            --out out

      - name: Artifact name
        id: n
        run: echo "name=$(echo '${{ matrix.source }}-${{ matrix.shard }}' | tr '/' '_')" >> "$GITHUB_OUTPUT"

      - name: Upload Germany records and board log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ steps.n.outputs.name }}
          path: |
            out/germany_*.jsonl.gz
            out/boards_*.csv
            out/stats_*.json
          retention-days: 14

      - name: Upload unfiltered raw records (worldwide)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ steps.n.outputs.name }}
          path: out/raw_*.jsonl.gz
          compression-level: 0
          retention-days: 14

  jobspy:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JobSpy
        run: pip install -U python-jobspy

      - name: Collect Germany via JobSpy (Indeed, LinkedIn, Glassdoor)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/jobspy_germany.py --out out --budget-min 300 \
            --limit "$([ '${{ inputs.limit }}' = '0' ] && echo 0 || echo 6)"

      - name: Upload Germany records and search log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-jobspy
          path: |
            out/germany_*.jsonl.gz
            out/boards_*.csv
            out/stats_*.json
          retention-days: 14

      - name: Upload raw records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-jobspy
          path: out/raw_*.jsonl.gz
          compression-level: 0
          retention-days: 14

  merge:
    needs: [collect, jobspy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install openpyxl

      - name: Download collected parts
        uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts

      - name: Merge, dedupe, validate URLs, export
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: "1"
        run: |
          EXTRA=""
          if [ "${{ inputs.validate_urls }}" != "true" ]; then EXTRA="--no-validate"; fi
          python scripts/germany_collect.py merge --in parts --out final \
            --workers 32 --validate-budget-min 300 $EXTRA

      - name: Upload dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: germany-jobs-${{ github.run_id }}
          path: final/
          retention-days: 30
